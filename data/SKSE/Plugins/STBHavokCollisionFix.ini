; STB Havok Collision Fix. A missing file or key means 1 (on). All fixes are independent.

[Fixes]
; Collision hit lists with a NaN distance crashed Havok's sort (aiming, activation, explosions, character movement).
HitSort = 1

; Broken MOPP collision bytecode in a .nif is repaired when the mesh loads (crash on an unknown opcode,
; crash or phantom collision on a jump past the end, freeze on a loop). Repaired meshes are named in the log.
MoppAtLoad = 1

; Out-of-range triangle keys of compressed mesh collision are replaced by a valid triangle of the same mesh.
CompressedMeshKeys = 1

; The physics solver's work buffers get a reserve (crash in fights with many creatures or ragdolls:
; EXCEPTION_BREAKPOINT or access violation inside Havok's solver). Same physics, no measurable cost.
SolverBuffer = 1

; No read of an island (group of touching bodies) that changed while it was being solved (crash).
IslandUnlock = 1

; Detaching a listener that was never attached does nothing instead of corrupting memory (crash now or later).
ListenerRemove = 1

; Queued physics changes wait while the world is locked for phantoms instead of re-running the queue endlessly
; (stack overflow crash); a runaway queue recursion is stopped.
PendingQueue = 1

; Broken lock counters of the physics world are repaired at every physics step (random crashes later);
; also switches bUseWorldLock:HAVOK back on if an ini turned it off.
WorldLock = 1

; Batch add/remove of physics objects (ragdolls, cells) leaves out objects that are already in the world,
; not in it or listed twice (crash later at a random place).
BatchCheck = 1

; The foot IK (feet on the ground) list gets room for 1024 entries at start, so it never moves while in use
; (crash with many characters around). About 57 KB of memory.
FootIkReserve = 1
