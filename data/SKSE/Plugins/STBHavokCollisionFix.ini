; STB Havok Collision Fix. A missing file or key means 1 (on). All fixes are independent.

[Fixes]
; Collision hit lists with a NaN distance crashed Havok's sort (aiming, activation, explosions, character movement).
HitSort = 1

; Broken MOPP collision bytecode in a .nif is repaired when the mesh loads (crash on an unknown opcode,
; crash or phantom collision on a jump past the end, freeze on a loop). Repaired meshes are named in the log.
MoppAtLoad = 1

; Out-of-range triangle keys of compressed mesh collision are replaced by a valid triangle of the same mesh.
CompressedMeshKeys = 1
